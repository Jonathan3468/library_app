name: smartlib
description: SmartLib — Library Management System (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing — replaces react-router-dom
  go_router: ^14.0.0

  # HTTP client — replaces axios
  dio: ^5.4.0

  # Toast notifications — replaces sonner's <Toaster>
  fluttertoast: ^8.2.4

  # Persistent storage — replaces localStorage
  shared_preferences: ^2.2.3

  # Image picker — replaces <ImageUpload> component
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true